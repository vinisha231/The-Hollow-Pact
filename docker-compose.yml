version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hollow_pact
      POSTGRES_PASSWORD: hollow_pact_dev
      POSTGRES_DB: hollow_pact
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./server/orchestration/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  orchestration:
    build:
      context: .
      dockerfile: server/orchestration/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://hollow_pact:hollow_pact_dev@postgres:5432/hollow_pact
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_prod}
      ENV: development
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  matchmaking:
    build:
      context: .
      dockerfile: server/matchmaking/Dockerfile
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  pg_data:
